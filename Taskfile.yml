version: '3'

vars:
  PLUGIN_JSON: plugins/afk/.claude-plugin/plugin.json

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  release:
    desc: "Release (usage: task release -- patch|minor|major)"
    vars:
      BUMP: '{{.CLI_ARGS}}'
      CURRENT:
        sh: jq -r '.version' {{.PLUGIN_JSON}}
      NEW_VERSION:
        sh: |
          IFS='.' read -r major minor patch <<< "{{.CURRENT}}"
          case "{{.BUMP}}" in
            patch) echo "$major.$minor.$((patch+1))" ;;
            minor) echo "$major.$((minor+1)).0" ;;
            major) echo "$((major+1)).0.0" ;;
            *) echo "invalid" && exit 1 ;;
          esac
    cmds:
      - jq --arg v "{{.NEW_VERSION}}" '.version = $v' {{.PLUGIN_JSON}} > tmp.json && mv tmp.json {{.PLUGIN_JSON}}
      - git add -A
      - git commit -m "v{{.NEW_VERSION}}"
      - git tag -a v{{.NEW_VERSION}} -m "Release v{{.NEW_VERSION}}"
      - git push origin main --tags
    requires:
      vars: [BUMP]
