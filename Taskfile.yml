version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  release:
    desc: "Tag and push release (usage: task release -- 1.0.0)"
    cmds:
      - git tag -a v{{.VERSION}} -m "Release v{{.VERSION}}"
      - git push origin v{{.VERSION}}
    vars:
      VERSION: '{{.CLI_ARGS}}'
    requires:
      vars: [VERSION]
